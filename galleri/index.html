<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Utopia Jazz | Galleri</title>
  <meta name="description" content="Bildarkiv från spelningar och kvällar på Utopia Jazz i Göteborg." />

  <!-- Google Fonts: Oswald + Barlow Condensed -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --cream: #F4F4ED;
      --navy: #12273E;
      --red: #991C1F;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background-color: var(--cream);
      color: var(--navy);
      font-family: 'Barlow Condensed', 'Bahnschrift', sans-serif;
    }

    .font-display {
      font-family: 'Oswald', 'Decima Medium', sans-serif;
    }

    /* Masonry-vägg som bevarar både stående och liggande fotoformat */
    .photo-wall {
      column-count: 1;
      column-gap: 1.25rem;
    }
    @media (min-width: 640px) {
      .photo-wall {
        column-count: 2;
        column-gap: 1.5rem;
      }
    }
    @media (min-width: 1024px) {
      .photo-wall {
        column-count: 3;
        column-gap: 1.75rem;
      }
    }

    .photo-card {
      break-inside: avoid;
      margin-bottom: 1.25rem;
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s ease;
    }
    @media (min-width: 640px) {
      .photo-card {
        margin-bottom: 1.5rem;
      }
    }
    @media (min-width: 1024px) {
      .photo-card {
        margin-bottom: 1.75rem;
      }
    }

    .photo-card:hover {
      transform: translate(-3px, -3px);
      box-shadow: 6px 6px 0px var(--navy);
    }

    .photo-card img {
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .photo-card:hover img {
      transform: scale(1.02);
    }
  </style>
</head>
<body class="min-h-screen w-full flex flex-col justify-between selection:bg-[#991C1F] selection:text-[#F4F4ED]">

  <!-- YTTRE AFFISCHRAM I EXAKT SAMMA STIL SOM STARTSIDAN -->
  <div class="flex-1 flex flex-col justify-between m-3 sm:m-6 md:m-8 border-[3px] border-[#12273E] bg-[#F4F4ED]">

    <!-- TOPPRAD: TILLBAKA TILL STARTSIDAN & SOCIALA LÄNKAR -->
    <header class="px-4 sm:px-8 py-4 border-b-[3px] border-[#12273E] flex flex-wrap items-center justify-between gap-3 text-sm sm:text-base tracking-[0.08em] uppercase font-semibold">
      <a
        href="./index.html"
        class="inline-flex items-center gap-2 hover:text-[#991C1F] transition-colors"
      >
        <svg class="w-4 h-4 shrink-0" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M12.5 8H3.5M3.5 8L7.5 4M3.5 8L7.5 12" stroke="currentColor" stroke-width="2" stroke-linecap="square" />
        </svg>
        <span>UTOPIA JAZZ</span>
      </a>

      <nav class="flex items-center gap-6 sm:gap-8">
        <a
          href="https://www.instagram.com/utopiajazzgbg/"
          target="_blank"
          rel="noreferrer"
          class="inline-flex items-center gap-1.5 hover:text-[#991C1F] transition-colors"
        >
          <span>INSTAGRAM</span>
          <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M4.5 11.5L11.5 4.5M11.5 4.5H5.5M11.5 4.5V10.5" stroke="currentColor" stroke-width="2" stroke-linecap="square" />
          </svg>
        </a>
        <a
          href="https://www.facebook.com/utopiajazzgbg/?locale=sv_SE"
          target="_blank"
          rel="noreferrer"
          class="inline-flex items-center gap-1.5 hover:text-[#991C1F] transition-colors"
        >
          <span>FACEBOOK</span>
          <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M4.5 11.5L11.5 4.5M11.5 4.5H5.5M11.5 4.5V10.5" stroke="currentColor" stroke-width="2" stroke-linecap="square" />
          </svg>
        </a>
      </nav>
    </header>

    <!-- GALLERIRUBRIK (TYSK ARKIV- / MENYKÄNSLA) -->
    <section class="px-4 sm:px-8 py-6 sm:py-8 border-b-[3px] border-[#12273E] flex flex-wrap items-baseline justify-between gap-4">
      <div class="flex items-baseline gap-4">
        <h1 class="font-display text-4xl sm:text-6xl font-bold uppercase tracking-[0.04em] text-[#991C1F]">
          GALLERI
        </h1>
        <span id="photo-count" class="text-sm sm:text-base font-semibold tracking-[0.1em] uppercase text-[#12273E]">
          [ ARKIV ]
        </span>
      </div>

      <p class="text-sm sm:text-base font-semibold tracking-[0.08em] uppercase">
        KARL JOHANSGATAN 6, GÖTEBORG
      </p>
    </section>

    <!-- BILDVÄGG (MASONRY GRID) -->
    <main class="flex-1 px-4 sm:px-8 py-6 sm:py-10">
      <div id="photo-wall" class="photo-wall">
        <!-- Bilder renderas automatiskt från listan i <script> längst ner -->
      </div>
    </main>

    <!-- SIDFOT: IDENTISK MED STARTSIDAN -->
    <footer class="border-t-[3px] border-[#12273E] px-4 sm:px-8 py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-sm sm:text-base font-medium tracking-[0.05em] uppercase">
      <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
        <span class="font-display text-[#991C1F] font-bold tracking-[0.08em]">ÖPPET</span>
        <span>TIS–TOR 17–23</span>
        <span>/</span>
        <span>FRE–LÖR 16–01</span>
      </div>

      <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
        <a href="tel:+46768941124" class="hover:text-[#991C1F] transition-colors">
          +46 76 894 11 24
        </a>
        <span>•</span>
        <a href="mailto:info@utopiajazz.com" class="hover:text-[#991C1F] transition-colors">
          INFO@UTOPIAJAZZ.COM
        </a>
        <span>•</span>
        <a href="mailto:anders@utopiajazz.com" class="hover:text-[#991C1F] transition-colors">
          BOKA BAND: ANDERS@UTOPIAJAZZ.COM
        </a>
      </div>
    </footer>

  </div>

  <!-- LIGHTBOX / HELSKÄRMSVISNING VID KLICK PÅ BILD -->
  <div
    id="lightbox"
    class="fixed inset-0 z-50 hidden bg-[#12273E]/95 p-4 sm:p-8 flex flex-col justify-between"
    role="dialog"
    aria-modal="true"
  >
    <!-- Topprad i Lightbox -->
    <div class="flex items-center justify-between text-[#F4F4ED] border-b-[2px] border-[#F4F4ED]/30 pb-3">
      <span id="lightbox-counter" class="font-display text-lg sm:text-xl tracking-[0.08em] uppercase">
        [ 01 / 09 ]
      </span>
      <button
        id="lightbox-close"
        type="button"
        class="font-display text-lg sm:text-xl font-bold tracking-[0.08em] uppercase px-3 py-1 border-[2px] border-[#F4F4ED] hover:bg-[#991C1F] hover:border-[#991C1F] transition-colors cursor-pointer"
      >
        STÄNG ✕
      </button>
    </div>

    <!-- Bildyta -->
    <div class="flex-1 flex items-center justify-center my-4 overflow-hidden relative">
      <img
        id="lightbox-img"
        src=""
        alt="Utopia Jazz"
        class="max-h-[75vh] max-w-full object-contain border-[3px] border-[#F4F4ED] bg-[#12273E]"
      />
    </div>

    <!-- Bottenrad: Bildtext & Föregående/Nästa -->
    <div class="flex flex-wrap items-center justify-between gap-4 text-[#F4F4ED] border-t-[2px] border-[#F4F4ED]/30 pt-3">
      <span id="lightbox-caption" class="text-base sm:text-lg font-semibold tracking-[0.06em] uppercase">
        UTOPIA JAZZ
      </span>

      <div class="flex items-center gap-3">
        <button
          id="lightbox-prev"
          type="button"
          class="font-display text-base sm:text-lg font-bold tracking-[0.08em] uppercase px-4 py-1.5 border-[2px] border-[#F4F4ED] hover:bg-[#F4F4ED] hover:text-[#12273E] transition-colors cursor-pointer"
        >
          ← FÖREGÅENDE
        </button>
        <button
          id="lightbox-next"
          type="button"
          class="font-display text-base sm:text-lg font-bold tracking-[0.08em] uppercase px-4 py-1.5 border-[2px] border-[#F4F4ED] hover:bg-[#991C1F] hover:border-[#991C1F] transition-colors cursor-pointer"
        >
          NÄSTA →
        </button>
      </div>
    </div>
  </div>

  <script>
    /**
     * LÄGG IN ERA EGNA BILDER HÄR:
     * Lägg era bildfiler i en mapp (t.ex. ./galleri/) och byt ut länkarna nedan.
     * Både stående (portrait) och liggande (landscape) bilder anpassar sig automatiskt!
     */
    const GALLERY_IMAGES = [
      {
        src: './utopiajazzbakgrundsmall.jpg',
        fallback: 'https://images.unsplash.com/photo-1511192336575-5a79af67a629?auto=format&fit=crop&w=900&q=80',
        caption: 'LIVE PÅ SCEN — KARL JOHANSGATAN 6'
      },
      {
        src: './galleri/bild-02.jpg',
        fallback: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=800&h=1100&q=80',
        caption: 'KVÄLLSSTÄMNING I SALONGEN'
      },
      {
        src: './galleri/bild-03.jpg',
        fallback: 'https://images.unsplash.com/photo-1415201364774-f6f0bb35f28f?auto=format&fit=crop&w=1000&h=750&q=80',
        caption: 'TRUMPET & KONTRABAS'
      },
      {
        src: './galleri/bild-04.jpg',
        fallback: 'https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?auto=format&fit=crop&w=800&h=1050&q=80',
        caption: 'SEN KVÄLLSSPELNING'
      },
      {
        src: './galleri/bild-05.jpg',
        fallback: 'https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?auto=format&fit=crop&w=1000&h=720&q=80',
        caption: 'BAR & DRYCK'
      },
      {
        src: './galleri/bild-06.jpg',
        fallback: 'https://images.unsplash.com/photo-1485579149621-3123dd979885?auto=format&fit=crop&w=800&h=1000&q=80',
        caption: 'JAM SESSION'
      },
      {
        src: './galleri/bild-07.jpg',
        fallback: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=1000&h=700&q=80',
        caption: 'AKUSTIK & NÄRVARO'
      },
      {
        src: './galleri/bild-08.jpg',
        fallback: 'https://images.unsplash.com/photo-1574169208507-84376144848b?auto=format&fit=crop&w=800&h=1100&q=80',
        caption: 'MAJORNA AFTER HOURS'
      },
      {
        src: './galleri/bild-09.jpg',
        fallback: 'https://images.unsplash.com/photo-1459749411175-04bf5292ceea?auto=format&fit=crop&w=1000&h=750&q=80',
        caption: 'PUBLIK & SCEN'
      }
    ];

    const wallEl = document.getElementById('photo-wall');
    const countEl = document.getElementById('photo-count');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxCaption = document.getElementById('lightbox-caption');
    const lightboxCounter = document.getElementById('lightbox-counter');
    let currentIndex = 0;

    function padZero(num) {
      return String(num).padStart(2, '0');
    }

    // Rendera bildväggen
    function renderGallery() {
      countEl.textContent = `[ ${padZero(GALLERY_IMAGES.length)} BILDER ]`;

      GALLERY_IMAGES.forEach((item, index) => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'photo-card w-full text-left border-[3px] border-[#12273E] bg-[#F4F4ED] block cursor-pointer focus:outline-none';
        card.setAttribute('aria-label', `Visa bild ${index + 1}: ${item.caption}`);

        const imgWrapper = document.createElement('div');
        imgWrapper.className = 'overflow-hidden bg-[#12273E]/10';

        const img = document.createElement('img');
        img.src = item.src;
        img.alt = item.caption;
        img.loading = 'lazy';
        img.className = 'w-full h-auto block';
        img.onerror = function () {
          if (this.src !== item.fallback) {
            this.src = item.fallback;
          }
        };

        const metaBar = document.createElement('div');
        metaBar.className = 'border-t-[3px] border-[#12273E] px-3 py-2 flex items-center justify-between gap-2 text-xs sm:text-sm font-semibold tracking-[0.06em] uppercase';
        metaBar.innerHTML = `
          <span class="text-[#991C1F] font-display font-bold">[ ${padZero(index + 1)} ]</span>
          <span class="truncate">${item.caption}</span>
        `;

        imgWrapper.appendChild(img);
        card.appendChild(imgWrapper);
        card.appendChild(metaBar);
        card.addEventListener('click', () => openLightbox(index));
        wallEl.appendChild(card);
      });
    }

    function updateLightbox() {
      const item = GALLERY_IMAGES[currentIndex];
      lightboxImg.src = item.src;
      lightboxImg.onerror = function () {
        if (this.src !== item.fallback) {
          this.src = item.fallback;
        }
      };
      lightboxCaption.textContent = item.caption;
      lightboxCounter.textContent = `[ ${padZero(currentIndex + 1)} / ${padZero(GALLERY_IMAGES.length)} ]`;
    }

    function openLightbox(index) {
      currentIndex = index;
      updateLightbox();
      lightbox.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.add('hidden');
      document.body.style.overflow = '';
    }

    function showNext() {
      currentIndex = (currentIndex + 1) % GALLERY_IMAGES.length;
      updateLightbox();
    }

    function showPrev() {
      currentIndex = (currentIndex - 1 + GALLERY_IMAGES.length) % GALLERY_IMAGES.length;
      updateLightbox();
    }

    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
    document.getElementById('lightbox-next').addEventListener('click', showNext);
    document.getElementById('lightbox-prev').addEventListener('click', showPrev);

    // Stäng vid klick utanför bilden
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    // Tangentbordsnavigering (Escape, Höger/Vänster pil)
    document.addEventListener('keydown', (e) => {
      if (lightbox.classList.contains('hidden')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowRight') showNext();
      if (e.key === 'ArrowLeft') showPrev();
    });

    // Touch-svep på mobil i lightbox
    let touchStartX = 0;
    lightbox.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    lightbox.addEventListener('touchend', (e) => {
      const diff = e.changedTouches[0].screenX - touchStartX;
      if (Math.abs(diff) > 45) {
        if (diff < 0) showNext();
        else showPrev();
      }
    }, { passive: true });

    renderGallery();
  </script>
</body>
</html>
