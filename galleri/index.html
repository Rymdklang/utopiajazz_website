<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Utopia Jazz | Galleri</title>
  <meta name="description" content="Bildarkiv från spelningar och kvällar på Utopia Jazz i Göteborg." />

  <!-- Google Fonts: Oswald + Barlow Condensed -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --cream: #F4F4ED;
      --navy: #12273E;
      --red: #991C1F;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background-color: var(--cream);
      color: var(--navy);
      font-family: 'Barlow Condensed', 'Bahnschrift', sans-serif;
    }

    .font-display {
      font-family: 'Oswald', 'Decima Medium', sans-serif;
    }

    .photo-card {
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s ease;
    }

    .photo-card:hover {
      transform: translate(-3px, -3px);
      box-shadow: 6px 6px 0px var(--navy);
    }

    .photo-card img {
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .photo-card:hover img {
      transform: scale(1.02);
    }
  </style>
</head>
<body class="min-h-screen w-full flex flex-col justify-between selection:bg-[#991C1F] selection:text-[#F4F4ED]">

  <!-- YTTRE AFFISCHRAM MATCHANDE STARTSIDAN -->
  <div class="flex-1 flex flex-col justify-between m-2 sm:m-4 md:m-5 border-[3px] border-[#12273E] bg-[#F4F4ED]">

    <!-- TOPPRAD: TILLBAKA TILL STARTSIDAN & SOCIALA LÄNKAR -->
    <header class="shrink-0 px-3 sm:px-6 py-2 sm:py-2.5 border-b-[3px] border-[#12273E] flex flex-wrap items-center justify-between gap-2 text-xs sm:text-sm tracking-[0.08em] uppercase font-semibold">
      <a
        id="back-to-home"
        href="../index.html"
        class="inline-flex items-center gap-1.5 hover:text-[#991C1F] transition-colors"
      >
        <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M12.5 8H3.5M3.5 8L7.5 4M3.5 8L7.5 12" stroke="currentColor" stroke-width="2" stroke-linecap="square" />
        </svg>
        <span>UTOPIA JAZZ</span>
      </a>

      <nav class="flex items-center gap-4 sm:gap-6">
        <a
          href="https://www.instagram.com/utopiajazzgbg/"
          target="_blank"
          rel="noreferrer"
          class="inline-flex items-center gap-1 hover:text-[#991C1F] transition-colors"
        >
          <span>INSTAGRAM</span>
          <svg class="w-3 h-3 shrink-0" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M4.5 11.5L11.5 4.5M11.5 4.5H5.5M11.5 4.5V10.5" stroke="currentColor" stroke-width="2" stroke-linecap="square" />
          </svg>
        </a>
        <a
          href="https://www.facebook.com/utopiajazzgbg/?locale=sv_SE"
          target="_blank"
          rel="noreferrer"
          class="inline-flex items-center gap-1 hover:text-[#991C1F] transition-colors"
        >
          <span>FACEBOOK</span>
          <svg class="w-3 h-3 shrink-0" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M4.5 11.5L11.5 4.5M11.5 4.5H5.5M11.5 4.5V10.5" stroke="currentColor" stroke-width="2" stroke-linecap="square" />
          </svg>
        </a>
      </nav>
    </header>

    <!-- GALLERIRUBRIK -->
    <section class="px-3 sm:px-6 py-4 sm:py-6 border-b-[3px] border-[#12273E] flex flex-wrap items-baseline justify-between gap-3">
      <div class="flex items-baseline gap-3 sm:gap-4">
        <h1 class="font-display text-3xl sm:text-5xl font-bold uppercase tracking-[0.04em] text-[#991C1F]">
          GALLERI
        </h1>
        <span id="photo-count" class="text-xs sm:text-sm font-semibold tracking-[0.1em] uppercase text-[#12273E]">
          [ 16 BILDER ]
        </span>
      </div>

      <p class="text-xs sm:text-sm font-semibold tracking-[0.08em] uppercase">
        KARL JOHANSGATAN 6, GÖTEBORG
      </p>
    </section>

    <!-- BILDVÄGG: JÄMNT RUTNÄT SOM RADAR UPP MOT BOTTEN -->
    <main class="flex-1 flex flex-col justify-between px-3 sm:px-6 py-4 sm:py-6">
      <div
        id="photo-wall"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-5 items-stretch"
      >
        <!-- 16 bilder renderas från GALLERY_IMAGES -->
      </div>
    </main>

    <!-- SIDFOT MATCHANDE STARTSIDAN -->
    <footer class="shrink-0 border-t-[3px] border-[#12273E] px-3 sm:px-6 py-2 sm:py-2.5 flex flex-col sm:flex-row sm:items-center justify-between gap-1.5 sm:gap-3 text-xs sm:text-sm font-medium tracking-[0.04em] uppercase">
      <div class="flex flex-wrap items-center gap-x-2 gap-y-0.5">
        <span class="font-display text-[#991C1F] font-bold tracking-[0.08em]">ÖPPET</span>
        <span>TIS–TOR 17–23</span>
        <span>/</span>
        <span>FRE–LÖR 16–01</span>
      </div>

      <div class="flex flex-wrap items-center gap-x-2 gap-y-0.5">
        <a href="tel:+46768941124" class="hover:text-[#991C1F] transition-colors">
          +46 76 894 11 24
        </a>
        <span>•</span>
        <a href="mailto:info@utopiajazz.com" class="hover:text-[#991C1F] transition-colors">
          INFO@UTOPIAJAZZ.COM
        </a>
        <span>•</span>
        <a href="mailto:anders@utopiajazz.com" class="hover:text-[#991C1F] transition-colors">
          BOKA BAND: ANDERS@UTOPIAJAZZ.COM
        </a>
      </div>
    </footer>

  </div>

  <!-- LIGHTBOX / HELSKÄRMSVISNING -->
  <div
    id="lightbox"
    class="fixed inset-0 z-50 hidden bg-[#12273E]/95 p-4 sm:p-8 flex flex-col justify-between"
    role="dialog"
    aria-modal="true"
  >
    <div class="flex items-center justify-between text-[#F4F4ED] border-b-[2px] border-[#F4F4ED]/30 pb-3">
      <span id="lightbox-counter" class="font-display text-lg sm:text-xl tracking-[0.08em] uppercase">
        [ 01 / 16 ]
      </span>
      <button
        id="lightbox-close"
        type="button"
        class="font-display text-lg sm:text-xl font-bold tracking-[0.08em] uppercase px-3 py-1 border-[2px] border-[#F4F4ED] hover:bg-[#991C1F] hover:border-[#991C1F] transition-colors cursor-pointer"
      >
        STÄNG ✕
      </button>
    </div>

    <div class="flex-1 flex items-center justify-center my-4 overflow-hidden relative">
      <img
        id="lightbox-img"
        src=""
        alt="Utopia Jazz"
        class="max-h-[75vh] max-w-full object-contain border-[3px] border-[#F4F4ED] bg-[#12273E]"
      />
    </div>

    <div class="flex flex-wrap items-center justify-between gap-4 text-[#F4F4ED] border-t-[2px] border-[#F4F4ED]/30 pt-3">
      <span id="lightbox-caption" class="text-base sm:text-lg font-semibold tracking-[0.06em] uppercase">
        UTOPIA JAZZ
      </span>

      <div class="flex items-center gap-3">
        <button
          id="lightbox-prev"
          type="button"
          class="font-display text-base sm:text-lg font-bold tracking-[0.08em] uppercase px-4 py-1.5 border-[2px] border-[#F4F4ED] hover:bg-[#F4F4ED] hover:text-[#12273E] transition-colors cursor-pointer"
        >
          ← FÖREGÅENDE
        </button>
        <button
          id="lightbox-next"
          type="button"
          class="font-display text-base sm:text-lg font-bold tracking-[0.08em] uppercase px-4 py-1.5 border-[2px] border-[#F4F4ED] hover:bg-[#991C1F] hover:border-[#991C1F] transition-colors cursor-pointer"
        >
          NÄSTA →
        </button>
      </div>
    </div>
  </div>

  <script>
    const GITHUB_RAW_BASE = 'https://raw.githubusercontent.com/Rymdklang/utopiajazz_website/main/galleri/';

    // Anpassa tillbakalänken automatiskt beroende på om sidan ligger i /galleri/ eller i roten
    (function setupBackLink() {
      const backLink = document.getElementById('back-to-home');
      if (!backLink) return;
      const inGalleryFolder = window.location.pathname.includes('/galleri');
      backLink.href = inGalleryFolder ? '../index.html' : './index.html';
    })();

    const GALLERY_IMAGES = [
      { file: '1.jpg',  caption: 'SCENEN © MARTIN WALLÈN',       focus: '70% 35%' },
      { file: '2.jpg',  caption: 'NEDERVÅNINGEN © SIXTEN MORITZ', focus: '52% 48%' },
      { file: '3.jpg',  caption: 'SCENEN © SIXTEN MORITZ',        focus: '50% 42%' },
      { file: '4.jpg',  caption: 'ÖVERVÅNINGEN © SIXTEN MORITZ',  focus: '55% 45%' },
      { file: '5.jpg',  caption: 'SCENEN © MARTIN WALLÈN',        focus: '72% 45%' },
      { file: '6.jpg',  caption: 'MERCH © SIXTEN MORITZ',         focus: '62% 52%' },
      { file: '7.jpg',  caption: 'NEDERVÅNINGEN © SIXTEN MORITZ', focus: '45% 48%' },
      { file: '8.jpg',  caption: 'SCENEN © SIXTEN MORITZ',        focus: '50% 25%' },
      { file: '9.jpg',  caption: 'SCENEN © MARTIN WALLÈN',        focus: '55% 22%' },
      { file: '10.jpg', caption: 'SCENEN © MARTIN WALLÈN',        focus: '60% 35%' },
      { file: '11.jpg', caption: 'SCENEN © SIXTEN MORITZ',        focus: '48% 32%' },
      { file: '12.jpg', caption: 'NEDERVÅNINGEN © MARTIN WALLÈN', focus: '52% 45%' },
      { file: '13.jpg', caption: 'SCENEN © SIXTEN MORITZ',        focus: '48% 36%' },
      { file: '14.jpg', caption: 'FRÅN GATAN © MARTIN WALLÈN',    focus: '36% 42%' },
      { file: '15.jpg', caption: 'FLYGELN © MARTIN WALLÈN',       focus: '52% 52%' },
      { file: '16.jpg', caption: 'SCENEN © SIXTEN MORITZ',        focus: '46% 32%' }
    ];

    const wallEl = document.getElementById('photo-wall');
    const countEl = document.getElementById('photo-count');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxCaption = document.getElementById('lightbox-caption');
    const lightboxCounter = document.getElementById('lightbox-counter');
    let currentIndex = 0;

    function padZero(num) {
      return String(num).padStart(2, '0');
    }

    function applyImageSources(imgEl, filename) {
      const inGalleryFolder = window.location.pathname.includes('/galleri');
      const candidates = inGalleryFolder
        ? [`./${filename}`, `../galleri/${filename}`, `${GITHUB_RAW_BASE}${filename}`]
        : [`./galleri/${filename}`, `${GITHUB_RAW_BASE}${filename}`];

      let attempt = 0;
      imgEl.onerror = function () {
        attempt += 1;
        if (attempt < candidates.length) {
          this.src = candidates[attempt];
        } else {
          this.onerror = null;
        }
      };
      imgEl.src = candidates[0];
    }

    function renderGallery() {
      countEl.textContent = `[ ${padZero(GALLERY_IMAGES.length)} BILDER ]`;
      wallEl.innerHTML = '';

      GALLERY_IMAGES.forEach((item, index) => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'photo-card h-full w-full text-left border-[3px] border-[#12273E] bg-[#F4F4ED] flex flex-col justify-between cursor-pointer focus:outline-none';
        card.setAttribute('aria-label', `Visa bild ${index + 1}: ${item.caption}`);

        const imgWrapper = document.createElement('div');
        imgWrapper.className = 'flex-1 w-full aspect-[4/3] overflow-hidden bg-[#12273E]/10';

        const img = document.createElement('img');
        applyImageSources(img, item.file);
        img.alt = item.caption;
        img.style.objectPosition = item.focus || '50% 45%';
        img.className = 'w-full h-full object-cover block';

        const metaBar = document.createElement('div');
        metaBar.className = 'shrink-0 border-t-[3px] border-[#12273E] px-3 py-2 flex items-center justify-between gap-2 text-xs sm:text-sm font-semibold tracking-[0.06em] uppercase bg-[#F4F4ED]';
        metaBar.innerHTML = `
          <span class="text-[#991C1F] font-display font-bold shrink-0">[ ${padZero(index + 1)} ]</span>
          <span class="truncate">${item.caption}</span>
        `;

        imgWrapper.appendChild(img);
        card.appendChild(imgWrapper);
        card.appendChild(metaBar);
        card.addEventListener('click', () => openLightbox(index));
        wallEl.appendChild(card);
      });
    }

    function updateLightbox() {
      const item = GALLERY_IMAGES[currentIndex];
      applyImageSources(lightboxImg, item.file);
      lightboxImg.alt = item.caption;
      lightboxCaption.textContent = item.caption;
      lightboxCounter.textContent = `[ ${padZero(currentIndex + 1)} / ${padZero(GALLERY_IMAGES.length)} ]`;
    }

    function openLightbox(index) {
      currentIndex = index;
      updateLightbox();
      lightbox.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.add('hidden');
      document.body.style.overflow = '';
    }

    function showNext() {
      currentIndex = (currentIndex + 1) % GALLERY_IMAGES.length;
      updateLightbox();
    }

    function showPrev() {
      currentIndex = (currentIndex - 1 + GALLERY_IMAGES.length) % GALLERY_IMAGES.length;
      updateLightbox();
    }

    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
    document.getElementById('lightbox-next').addEventListener('click', showNext);
    document.getElementById('lightbox-prev').addEventListener('click', showPrev);

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    document.addEventListener('keydown', (e) => {
      if (lightbox.classList.contains('hidden')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowRight') showNext();
      if (e.key === 'ArrowLeft') showPrev();
    });

    let touchStartX = 0;
    lightbox.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    lightbox.addEventListener('touchend', (e) => {
      const diff = e.changedTouches[0].screenX - touchStartX;
      if (Math.abs(diff) > 45) {
        if (diff < 0) showNext();
        else showPrev();
      }
    }, { passive: true });

    renderGallery();
  </script>
</body>
</html>
