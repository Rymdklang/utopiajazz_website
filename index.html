<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Utopia Jazz | Göteborg</title>
  <meta name="description" content="Utopia Jazz på Karl Johansgatan 6 i Göteborg." />

  <!-- Google Fonts: Oswald + Barlow Condensed -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --cream: #F1F0EA;
      --navy: #0F2133;
      --red: #8F1918;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background-color: var(--cream);
      color: var(--navy);
      font-family: 'Barlow Condensed', 'Bahnschrift', sans-serif;
    }

    .font-display {
      font-family: 'Oswald', 'Decima Medium', sans-serif;
    }

    .stage-row {
      transition: background-color 0.2s ease, color 0.2s ease, padding-left 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .stage-row:hover {
      background-color: var(--navy);
      color: var(--cream);
      padding-left: 1rem;
    }
    .stage-row:hover .row-arrow {
      transform: translate(4px, -4px);
      color: var(--red);
    }
    .row-arrow {
      display: inline-block;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), color 0.2s ease;
    }
  </style>
</head>
<body class="min-h-screen w-full flex flex-col justify-between selection:bg-[#8F1918] selection:text-[#F1F0EA]">

  <!-- STILREN YTTRE AFFISCHRAM I MENYNS EXAKTA FÄRGER -->
  <div class="flex-1 flex flex-col justify-between m-3 sm:m-6 md:m-8 border-[3px] border-[#0F2133] bg-[#F1F0EA]">

    <!-- TOPPRAD: ADRESS & SOCIALA LÄNKAR -->
    <header class="px-4 sm:px-8 py-4 border-b-[2px] border-[#0F2133] flex flex-wrap items-center justify-between gap-3 text-sm sm:text-base tracking-[0.08em] uppercase font-semibold">
      <a
        href="https://maps.google.com/?q=Karl+Johansgatan+6,+Göteborg"
        target="_blank"
        rel="noreferrer"
        class="hover:text-[#8F1918] transition-colors"
      >
        KARL JOHANSGATAN 6, GÖTEBORG
      </a>

      <nav class="flex items-center gap-6 sm:gap-8">
        <a
          href="https://www.instagram.com/utopiajazzgbg/"
          target="_blank"
          rel="noreferrer"
          class="hover:text-[#8F1918] transition-colors"
        >
          INSTAGRAM ↗
        </a>
        <a
          href="https://www.facebook.com/utopiajazzgbg/?locale=sv_SE"
          target="_blank"
          rel="noreferrer"
          class="hover:text-[#8F1918] transition-colors"
        >
          FACEBOOK ↗
        </a>
      </nav>
    </header>

    <!-- MITTENDEL: REN LOGOTYP MED GENERÖS LUFT -->
    <section class="flex-1 min-h-[260px] sm:min-h-[340px] px-4 sm:px-8 py-12 flex items-center justify-center">
      <!-- Logotyp i originalfärg utan filter eller mask -->
      <img
        src="./utopiajazzlogosmall.png"
        alt="Utopia Jazz"
        class="w-60 sm:w-72 md:w-80 h-auto object-contain select-none rotate-90"
      />
    </section>

    <!-- NEDRE DEL: TRE AVSKALADE HUVUDLÄNKAR + SIDFOT -->
    <div class="border-t-[3px] border-[#0F2133]">
      <main class="divide-y-[2px] divide-[#0F2133]">
        <!-- 01. PROGRAM -->
        <a
          href="https://billetto.se/users/utopia-jazz"
          target="_blank"
          rel="noreferrer"
          class="stage-row px-4 sm:px-8 py-5 sm:py-6 flex items-center justify-between gap-4 block"
        >
          <span class="font-display text-3xl sm:text-5xl font-bold uppercase tracking-[0.04em]">
            PROGRAM
          </span>
          <span class="row-arrow font-display text-2xl sm:text-4xl font-bold text-[#8F1918] shrink-0">
            ↗
          </span>
        </a>

        <!-- 02. BOKA BORD -->
        <a
          href="https://book.easytable.com/book/?id=c5c76&lang=auto"
          target="_blank"
          rel="noreferrer"
          class="stage-row px-4 sm:px-8 py-5 sm:py-6 flex items-center justify-between gap-4 block"
        >
          <span class="font-display text-3xl sm:text-5xl font-bold uppercase tracking-[0.04em]">
            BOKA BORD
          </span>
          <span class="row-arrow font-display text-2xl sm:text-4xl font-bold text-[#8F1918] shrink-0">
            ↗
          </span>
        </a>

        <!-- 03. MENY -->
        <a
          href="https://utopiajazz.com/wp-content/uploads/2026/09/UtopiaMeny.260820-UTKAST-5.pdf"
          target="_blank"
          rel="noreferrer"
          class="stage-row px-4 sm:px-8 py-5 sm:py-6 flex items-center justify-between gap-4 block"
        >
          <span class="font-display text-3xl sm:text-5xl font-bold uppercase tracking-[0.04em]">
            MENY
          </span>
          <span class="row-arrow font-display text-2xl sm:text-4xl font-bold text-[#8F1918] shrink-0">
            ↗
          </span>
        </a>
      </main>

      <!-- SIDFOT: ÖPPETTIDER & KONTAKT -->
      <footer class="border-t-[3px] border-[#0F2133] px-4 sm:px-8 py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-sm sm:text-base font-medium tracking-[0.05em] uppercase">
        <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
          <span class="font-display text-[#8F1918] font-bold tracking-[0.08em]">ÖPPET</span>
          <span>TIS–TOR 17–23</span>
          <span>/</span>
          <span>FRE–LÖR 16–01</span>
        </div>

        <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
          <a href="tel:+46768941124" class="hover:text-[#8F1918] transition-colors">
            +46 76 894 11 24
          </a>
          <span>•</span>
          <a href="mailto:info@utopiajazz.com" class="hover:text-[#8F1918] transition-colors">
            INFO@UTOPIAJAZZ.COM
          </a>
          <span>•</span>
          <a href="mailto:anders@utopiajazz.com" class="hover:text-[#8F1918] transition-colors">
            BOKA BAND: ANDERS@UTOPIAJAZZ.COM
          </a>
        </div>
      </footer>
    </div>

  </div>

</body>
</html>
