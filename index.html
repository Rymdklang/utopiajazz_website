<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Utopia Jazz | Göteborg</title>
  <meta name="description" content="Live jazz, mat och dryck på Karl Johansgatan 6 i Göteborg." />

  <!-- Google Font: Oswald -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background-color: #F1F0EA;
      color: #0F2133;
      font-family: 'Oswald', sans-serif;
    }

    /* Synkoperad hover-känsla på action-knapparna */
    .jazz-btn {
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.2s ease, color 0.2s ease;
    }
    .jazz-btn:hover .jazz-btn-label {
      transform: translateY(-2px) rotate(-1.5deg);
    }
    .jazz-btn-label {
      display: inline-block;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
  </style>
</head>
<body class="min-h-screen w-full flex flex-col justify-between selection:bg-[#8F1918] selection:text-[#F1F0EA]">

  <!-- ARCHITECTURAL TOP GRID BAR -->
  <header class="w-full grid grid-cols-12 border-b-[6px] border-[#0F2133] bg-[#F1F0EA]">
    <!-- Solid Navy Accent Block med synkoperad röd taktmarkering -->
    <div class="col-span-2 bg-[#0F2133] border-r-[6px] border-[#0F2133] flex items-stretch justify-end">
      <div class="w-3 sm:w-5 bg-[#8F1918] border-l-[6px] border-[#0F2133]"></div>
    </div>

    <!-- Brand Title -->
    <div class="col-span-5 sm:col-span-7 px-3 sm:px-6 py-3 sm:py-4 flex items-center border-r-[6px] border-[#0F2133]">
      <span class="text-lg sm:text-2xl font-bold tracking-[0.06em] sm:tracking-[0.08em] uppercase truncate">
        UTOPIA JAZZ
      </span>
    </div>

    <!-- Social Links -->
    <div class="col-span-5 sm:col-span-3 px-2.5 sm:px-6 py-3 sm:py-4 flex items-center justify-end gap-2.5 sm:gap-6 text-xs sm:text-base font-semibold tracking-[0.06em] sm:tracking-[0.1em] uppercase">
      <a
        href="https://www.instagram.com/utopiajazzgbg/"
        target="_blank"
        rel="noreferrer"
        class="hover:text-[#8F1918] transition-colors whitespace-nowrap"
      >
        INSTAGRAM
      </a>
      <a
        href="https://www.facebook.com/utopiajazzgbg/?locale=sv_SE"
        target="_blank"
        rel="noreferrer"
        class="hover:text-[#8F1918] transition-colors whitespace-nowrap"
      >
        FACEBOOK
      </a>
    </div>
  </header>

  <!-- MAIN MONDRIAN / NEO-PLASTICIST GRID CANVAS -->
  <main class="flex-1 w-full grid grid-cols-12">
    <!-- Left Structural Rail (Desktop) — Synkoperade Mondrian-block -->
    <div class="hidden md:flex md:col-span-2 flex-col border-r-[6px] border-[#0F2133]">
      <!-- Övre block: Asymmetrisk uppdelning -->
      <div class="h-[26%] border-b-[6px] border-[#0F2133] grid grid-cols-3">
        <div class="col-span-2 bg-[#F1F0EA] border-r-[6px] border-[#0F2133]"></div>
        <div class="col-span-1 flex flex-col">
          <div class="h-1/2 border-b-[6px] border-[#0F2133] bg-[#0F2133]"></div>
          <div class="flex-1 bg-[#F1F0EA]"></div>
        </div>
      </div>

      <!-- Mittenblock: Rött fält uppdelat i synkoperad rytm -->
      <div class="h-[44%] border-b-[6px] border-[#0F2133] grid grid-cols-3">
        <div class="col-span-2 bg-[#8F1918] border-r-[6px] border-[#0F2133]"></div>
        <div class="col-span-1 flex flex-col">
          <div class="h-2/3 border-b-[6px] border-[#0F2133] bg-[#F1F0EA]"></div>
          <div class="flex-1 bg-[#0F2133]"></div>
        </div>
      </div>

      <!-- Nedre block: Rytmiska färgblock -->
      <div class="flex-1 grid grid-cols-3 bg-[#F1F0EA]">
        <div class="border-r-[6px] border-[#0F2133] bg-[#F1F0EA]"></div>
        <div class="border-r-[6px] border-[#0F2133] bg-[#0F2133]"></div>
        <div class="bg-[#8F1918]"></div>
      </div>
    </div>

    <!-- Centerpiece: Logo + Core Navigation Grid -->
    <div class="col-span-12 md:col-span-8 flex flex-col justify-between">
      <!-- Upper Cell: Dominant Stacked Logo -->
      <div class="relative flex-1 min-h-[380px] sm:min-h-[460px] md:min-h-[520px] flex items-center justify-center p-4 sm:p-6 border-b-[6px] border-[#0F2133] bg-[#F1F0EA] overflow-hidden">
        <!-- Stacked Logo rotated 90 degrees and scaled to fill the center square -->
        <img
          src="./utopiajazzlogosmall.png"
          alt="Utopia Jazz"
          onerror="this.style.display='none'; document.getElementById('svg-logo-fallback').style.display='flex';"
          class="w-[340px] sm:w-[440px] md:w-[500px] lg:w-[560px] max-w-none max-h-[82vw] sm:max-h-[68vw] md:max-h-[54vw] object-contain select-none rotate-90 transition-transform duration-500 ease-out hover:rotate-[88.5deg]"
        />

        <!-- Vector SVG Fallback (visas i förhandsvisningen om lokal PNG-fil saknas) -->
        <div id="svg-logo-fallback" style="display: none;" class="w-full h-full items-center justify-center">
          <svg
            viewBox="0 0 420 500"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            class="w-[320px] sm:w-[420px] md:w-[480px] lg:w-[540px] max-w-none max-h-[80vw] sm:max-h-[66vw] md:max-h-[52vw] select-none rotate-90 transition-transform duration-500 ease-out hover:rotate-[88.5deg]"
            aria-label="Utopia Jazz"
          >
            <g fill="#0F2133" font-family="'Oswald', Impact, sans-serif" font-weight="700" letter-spacing="-2">
              <g transform="translate(188, 468) rotate(-90)">
                <text x="0" y="0" font-size="148">UTOPIA</text>
              </g>
              <g transform="translate(362, 478) rotate(-91.5)">
                <text x="0" y="0" font-size="142">JAZZ</text>
              </g>
            </g>
          </svg>
        </div>
      </div>

      <!-- Lower Cell: High-Contrast 3-Button Action Grid med synkoperad rörelse -->
      <div class="grid grid-cols-1 sm:grid-cols-3">
        <!-- PROGRAM — Bold Crimson Block -->
        <a
          href="https://billetto.se/users/utopia-jazz"
          target="_blank"
          rel="noreferrer"
          class="jazz-btn py-6 sm:py-8 px-6 text-2xl sm:text-3xl font-bold tracking-[0.1em] uppercase border-b-[6px] sm:border-b-0 sm:border-r-[6px] border-[#0F2133] bg-[#8F1918] text-[#F1F0EA] hover:bg-[#751312] text-center block"
        >
          <span class="jazz-btn-label">PROGRAM</span>
        </a>

        <!-- BOKA BORD — Crisp Cream Block -->
        <a
          href="https://book.easytable.com/book/?id=c5c76&lang=auto"
          target="_blank"
          rel="noreferrer"
          class="jazz-btn py-6 sm:py-8 px-6 text-2xl sm:text-3xl font-bold tracking-[0.1em] uppercase border-b-[6px] sm:border-b-0 sm:border-r-[6px] border-[#0F2133] bg-[#F1F0EA] text-[#0F2133] hover:bg-[#0F2133] hover:text-[#F1F0EA] text-center block"
        >
          <span class="jazz-btn-label">BOKA BORD</span>
        </a>

        <!-- MENY — Solid Midnight Navy Block -->
        <a
          href="https://utopiajazz.com/wp-content/uploads/2026/09/UtopiaMeny.260820-UTKAST-5.pdf"
          target="_blank"
          rel="noreferrer"
          class="jazz-btn py-6 sm:py-8 px-6 text-2xl sm:text-3xl font-bold tracking-[0.1em] uppercase bg-[#0F2133] text-[#F1F0EA] hover:bg-[#8F1918] text-center block"
        >
          <span class="jazz-btn-label">MENY</span>
        </a>
      </div>
    </div>

    <!-- Right Structural Rail (Desktop) — Asymmetriska Mondrian-block -->
    <div class="hidden md:flex md:col-span-2 flex-col border-l-[6px] border-[#0F2133]">
      <!-- Topp: Navy + off-beat röd stapel -->
      <div class="h-[20%] border-b-[6px] border-[#0F2133] grid grid-cols-4">
        <div class="col-span-3 bg-[#0F2133] border-r-[6px] border-[#0F2133]"></div>
        <div class="col-span-1 bg-[#8F1918]"></div>
      </div>

      <!-- Mitten: Luftiga asymmetriska rutor -->
      <div class="flex-1 border-b-[6px] border-[#0F2133] grid grid-cols-3 bg-[#F1F0EA]">
        <div class="col-span-2 border-r-[6px] border-[#0F2133] flex flex-col">
          <div class="h-3/5 border-b-[6px] border-[#0F2133]"></div>
          <div class="flex-1"></div>
        </div>
        <div class="col-span-1 flex flex-col">
          <div class="h-2/5 border-b-[6px] border-[#0F2133] bg-[#0F2133]"></div>
          <div class="flex-1 bg-[#F1F0EA]"></div>
        </div>
      </div>

      <!-- Botten: Off-beat rött & krämvitt block -->
      <div class="h-[28%] grid grid-cols-3">
        <div class="col-span-1 border-r-[6px] border-[#0F2133] bg-[#F1F0EA]"></div>
        <div class="col-span-2 bg-[#8F1918]"></div>
      </div>
    </div>
  </main>

  <!-- ARCHITECTURAL FOOTER GRID -->
  <footer class="w-full grid grid-cols-12 border-t-[6px] border-[#0F2133] bg-[#F1F0EA] text-xs sm:text-sm font-semibold tracking-[0.1em] uppercase">
    <!-- Hours & Address -->
    <div class="col-span-12 lg:col-span-6 px-4 sm:px-6 py-4 flex flex-wrap items-center justify-center lg:justify-start gap-x-4 gap-y-1 border-b-[6px] lg:border-b-0 lg:border-r-[6px] border-[#0F2133]">
      <span>TIS–TOR 17–23</span>
      <span>•</span>
      <span>FRE–LÖR 16–01</span>
      <span>•</span>
      <a
        href="https://maps.google.com/?q=Karl+Johansgatan+6,+Göteborg"
        target="_blank"
        rel="noreferrer"
        class="underline underline-offset-4 hover:text-[#8F1918]"
      >
        KARL JOHANSGATAN 6, GBG
      </a>
    </div>

    <!-- Contact & Band Booking -->
    <div class="col-span-12 lg:col-span-5 px-4 sm:px-6 py-4 flex flex-wrap items-center justify-center lg:justify-end gap-x-4 gap-y-1 lg:border-r-[6px] border-[#0F2133]">
      <a href="tel:+46768941124" class="hover:text-[#8F1918]">
        +46 76 894 11 24
      </a>
      <span>•</span>
      <a href="mailto:info@utopiajazz.com" class="hover:text-[#8F1918]">
        INFO@UTOPIAJAZZ.COM
      </a>
      <span>•</span>
      <a href="mailto:anders@utopiajazz.com" class="hover:text-[#8F1918]">
        BOKA BAND: ANDERS@UTOPIAJAZZ.COM
      </a>
    </div>

    <!-- Solid Red Corner Block -->
    <div class="hidden lg:block lg:col-span-1 bg-[#8F1918]"></div>
  </footer>

</body>
</html>
