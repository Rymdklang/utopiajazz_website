<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Utopia Jazz | Göteborg</title>
  <meta name="description" content="Utopia Jazz på Karl Johansgatan 6 i Göteborg." />

  <!-- Google Fonts: Oswald + Barlow Condensed -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --cream: #F4F4ED;
      --navy: #12273E;
      --red: #991C1F;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background-color: var(--cream);
      color: var(--navy);
      font-family: 'Barlow Condensed', 'Bahnschrift', sans-serif;
    }

    .font-display {
      font-family: 'Oswald', 'Decima Medium', sans-serif;
    }

    .stage-row {
      transition: background-color 0.2s ease, color 0.2s ease, padding-left 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .stage-row:hover {
      background-color: var(--navy);
      color: var(--cream);
      padding-left: 1rem;
    }
    .stage-row:hover .row-arrow {
      transform: translate(4px, -4px);
      color: var(--cream);
    }
    .row-arrow {
      display: inline-block;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), color 0.2s ease;
    }

    /* Håller proportionerna perfekta när logotypen roteras 90 grader – kompakt för att rymmas utan scroll */
    .logo-stage {
      width: min(210px, 50vw);
      height: min(155px, 36vw);
    }
    @media (min-width: 640px) {
      .logo-stage {
        width: 280px;
        height: 205px;
      }
    }
    @media (min-width: 768px) {
      .logo-stage {
        width: 320px;
        height: 230px;
      }
    }
  </style>
</head>
<body class="h-[100dvh] min-h-0 overflow-hidden w-full flex flex-col justify-between selection:bg-[#991C1F] selection:text-[#F4F4ED]">
