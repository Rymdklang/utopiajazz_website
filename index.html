<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Utopia Jazz | Göteborg</title>
  <meta name="description" content="Utopia Jazz på Karl Johansgatan 6 i Göteborg." />

  <!-- Google Fonts: Oswald + Barlow Condensed -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --cream: #F4F4ED;
      --navy: #12273E;
      --red: #991C1F;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background-color: var(--cream);
      color: var(--navy);
      font-family: 'Barlow Condensed', 'Bahnschrift', sans-serif;
    }

    .font-display {
      font-family: 'Oswald', 'Decima Medium', sans-serif;
    }

    .stage-row {
      transition: background-color 0.2s ease, color 0.2s ease, padding-left 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .stage-row:hover {
      background-color: var(--navy);
      color: var(--cream);
      padding-left: 1rem;
    }
    .stage-row:hover .row-arrow {
      transform: translate(4px, -4px);
      color: var(--cream);
    }
    .row-arrow {
      display: inline-block;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), color 0.2s ease;
    }

    /* Håller proportionerna perfekta när logotypen roteras 90 grader */
    .logo-stage {
      width: min(320px, 68vw);
      height: min(260px, 54vw);
    }
    @media (min-width: 640px) {
      .logo-stage {
        width: 400px;
        height: 320px;
      }
    }
    @media (min-width: 768px) {
      .logo-stage {
        width: 460px;
        height: 360px;
      }
    }
  </style>
</head>
<body class="min-h-screen w-full flex flex-col justify-between selection:bg-[#991C1F] selection:text-[#F4F4ED]">

  <!-- STILREN YTTRE AFFISCHRAM I BAKGRUND (#F4F4ED), OUTLINE/TEXT (#12273E) & ACCENT (#991C1F) -->
  <div class="flex-1 flex flex-col justify-between m-3 sm:m-6 md:m-8 border-[3px] border-[#12273E] bg-[#F4F4ED]">

    <!-- TOPPRAD: ADRESS & SOCIALA LÄNKAR -->
    <header class="px-4 sm:px-8 py-4 border-b-[3px] border-[#12273E] flex flex-wrap items-center justify-between gap-3 text-sm sm:text-base tracking-[0.08em] uppercase font-semibold">
      <a
        href="https://maps.google.com/?q=Karl+Johansgatan+6,+Göteborg"
        target="_blank"
        rel="noreferrer"
        class="hover:text-[#991C1F] transition-colors"
      >
        KARL JOHANSGATAN 6, GÖTEBORG
      </a>

      <nav class="flex items-center gap-6 sm:gap-8">
        <a
          href="https://www.instagram.com/utopiajazzgbg/"
          target="_blank"
          rel="noreferrer"
          class="hover:text-[#991C1F] transition-colors"
        >
          INSTAGRAM ↗
        </a>
        <a
          href="https://www.facebook.com/utopiajazzgbg/?locale=sv_SE"
          target="_blank"
          rel="noreferrer"
          class="hover:text-[#991C1F] transition-colors"
        >
          FACEBOOK ↗
        </a>
      </nav>
    </header>

    <!-- MITTENDEL: UTOPIA LOGOTYP INRAMAD I AFFISCHKOMPOSITION -->
    <section class="flex-1 min-h-[280px] sm:min-h-[360px] px-4 sm:px-8 py-8 sm:py-12 flex items-center justify-center">
      <div class="relative w-full max-w-3xl flex items-center justify-center py-6 sm:py-8">
        <!-- Tunna, eleganta registreringslinjer i #12273E & #991C1F som förankrar logotypen i affischen -->
        <div class="hidden sm:block flex-1 h-[2px] bg-[#12273E] mr-6"></div>

        <div class="logo-stage relative flex items-center justify-center shrink-0">
          <!-- Din uppladdade röda logotypfil (#991C1F) -->
          <img
            src="./utopiajazzlogosmall.png"
            alt="Utopia Jazz"
            onerror="this.style.display='none'; document.getElementById('red-logo-preview').style.display='flex';"
            class="h-[260px] sm:h-[340px] md:h-[400px] w-auto max-w-none object-contain select-none rotate-90"
          />

          <!-- Vektor-fallback i exakt #991C1F (visas i förhandsvisningen) -->
          <div id="red-logo-preview" style="display: none;" class="w-full h-full items-center justify-center">
            <svg viewBox="0 0 420 500" fill="none" xmlns="http://www.w3.org/2000/svg" class="h-[250px] sm:h-[330px] md:h-[390px] w-auto select-none rotate-90" aria-label="Utopia Jazz">
              <g fill="#991C1F" font-family="'Oswald', Impact, sans-serif" font-weight="700" letter-spacing="-2">
                <g transform="translate(188, 468) rotate(-90)">
                  <text x="0" y="0" font-size="148">UTOPIA</text>
                </g>
                <g transform="translate(362, 478) rotate(-91.5)">
                  <text x="0" y="0" font-size="142">JAZZ</text>
                </g>
              </g>
            </svg>
          </div>
        </div>

        <div class="hidden sm:block flex-1 h-[2px] bg-[#991C1F] ml-6"></div>
      </div>
    </section>

    <!-- NEDRE DEL: TRE AVSKALADE HUVUDLÄNKAR + SIDFOT -->
    <div class="border-t-[3px] border-[#12273E]">
      <main class="divide-y-[3px] divide-[#12273E]">
        <!-- 01. PROGRAM -->
        <a
          href="https://billetto.se/users/utopia-jazz"
          target="_blank"
          rel="noreferrer"
          class="stage-row px-4 sm:px-8 py-5 sm:py-6 flex items-center justify-between gap-4 block"
        >
          <span class="font-display text-3xl sm:text-5xl font-bold uppercase tracking-[0.04em]">
            PROGRAM
          </span>
          <span class="row-arrow font-display text-2xl sm:text-4xl font-bold text-[#991C1F] shrink-0">
            ↗
          </span>
        </a>

        <!-- 02. BOKA BORD -->
        <a
          href="https://book.easytable.com/book/?id=c5c76&lang=auto"
          target="_blank"
          rel="noreferrer"
          class="stage-row px-4 sm:px-8 py-5 sm:py-6 flex items-center justify-between gap-4 block"
        >
          <span class="font-display text-3xl sm:text-5xl font-bold uppercase tracking-[0.04em]">
            BOKA BORD
          </span>
          <span class="row-arrow font-display text-2xl sm:text-4xl font-bold text-[#991C1F] shrink-0">
            ↗
          </span>
        </a>

        <!-- 03. MENY -->
        <a
          href="https://utopiajazz.com/wp-content/uploads/2026/09/UtopiaMeny.260820-UTKAST-5.pdf"
          target="_blank"
          rel="noreferrer"
          class="stage-row px-4 sm:px-8 py-5 sm:py-6 flex items-center justify-between gap-4 block"
        >
          <span class="font-display text-3xl sm:text-5xl font-bold uppercase tracking-[0.04em]">
            MENY
          </span>
          <span class="row-arrow font-display text-2xl sm:text-4xl font-bold text-[#991C1F] shrink-0">
            ↗
          </span>
        </a>
      </main>

      <!-- SIDFOT: ÖPPETTIDER & KONTAKT -->
      <footer class="border-t-[3px] border-[#12273E] px-4 sm:px-8 py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-sm sm:text-base font-medium tracking-[0.05em] uppercase">
        <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
          <span class="font-display text-[#991C1F] font-bold tracking-[0.08em]">ÖPPET</span>
          <span>TIS–TOR 17–23</span>
          <span>/</span>
          <span>FRE–LÖR 16–01</span>
        </div>

        <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
          <a href="tel:+46768941124" class="hover:text-[#991C1F] transition-colors">
            +46 76 894 11 24
          </a>
          <span>•</span>
          <a href="mailto:info@utopiajazz.com" class="hover:text-[#991C1F] transition-colors">
            INFO@UTOPIAJAZZ.COM
          </a>
          <span>•</span>
          <a href="mailto:anders@utopiajazz.com" class="hover:text-[#991C1F] transition-colors">
            BOKA BAND: ANDERS@UTOPIAJAZZ.COM
          </a>
        </div>
      </footer>
    </div>

  </div>

</body>
</html>
