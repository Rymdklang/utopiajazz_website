<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Utopia Jazz | Göteborg</title>
  <meta name="description" content="Live jazz, mat och dryck på Karl Johansgatan 6 i Göteborg." />

  <!-- Google Font: Oswald -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background-color: #F1F0EA;
      color: #0F2133;
      font-family: 'Oswald', sans-serif;
    }
  </style>
</head>
<body class="min-h-screen w-full flex flex-col justify-between selection:bg-[#8F1918] selection:text-[#F1F0EA]">

  <!-- ARCHITECTURAL TOP GRID BAR -->
  <header class="w-full grid grid-cols-12 border-b-[6px] border-[#0F2133]">
    <!-- Solid Navy Accent Block -->
    <div class="col-span-2 bg-[#0F2133] border-r-[6px] border-[#0F2133]"></div>

    <!-- Brand Title -->
    <div class="col-span-5 sm:col-span-7 px-3 sm:px-6 py-3 sm:py-4 flex items-center border-r-[6px] border-[#0F2133]">
      <span class="text-lg sm:text-2xl font-bold tracking-[0.06em] sm:tracking-[0.08em] uppercase truncate">
        UTOPIA JAZZ
      </span>
    </div>

    <!-- Social Links -->
    <div class="col-span-5 sm:col-span-3 px-2.5 sm:px-6 py-3 sm:py-4 flex flex-wrap items-center justify-end gap-x-3 gap-y-1 sm:gap-6 text-xs sm:text-base font-semibold tracking-[0.06em] sm:tracking-[0.1em] uppercase">
      <a
        href="https://www.instagram.com/utopiajazzgbg/"
        target="_blank"
        rel="noreferrer"
        class="hover:text-[#8F1918] transition-colors"
      >
        INSTAGRAM
      </a>
      <a
        href="https://www.facebook.com/utopiajazzgbg/?locale=sv_SE"
        target="_blank"
        rel="noreferrer"
        class="hover:text-[#8F1918] transition-colors"
      >
        FACEBOOK
      </a>
    </div>
  </header>

  <!-- MAIN MONDRIAN / NEO-PLASTICIST GRID CANVAS -->
  <main class="flex-1 w-full grid grid-cols-12">
    <!-- Left Structural Rail (Desktop) -->
    <div class="hidden md:flex md:col-span-2 flex-col border-r-[6px] border-[#0F2133]">
      <div class="h-1/3 border-b-[6px] border-[#0F2133]"></div>
      <div class="h-1/3 border-b-[6px] border-[#0F2133] bg-[#8F1918]"></div>
      <div class="flex-1"></div>
    </div>

    <!-- Centerpiece: Logo + Core Navigation Grid -->
    <div class="col-span-12 md:col-span-8 flex flex-col justify-between">
      <!-- Upper Cell: Dominant Stacked Logo -->
      <div class="relative flex-1 flex items-center justify-center py-6 sm:py-10 px-4 border-b-[6px] border-[#0F2133] bg-[#F1F0EA] overflow-hidden">
        <!-- Stacked Logo rotated 90 degrees and scaled to fill the center square -->
        <img
          src="./utopiajazzlogosmall.png"
          alt="Utopia Jazz"
          onerror="this.style.display='none'; document.getElementById('svg-logo-fallback').style.display='flex';"
          class="w-[82%] max-w-[440px] max-h-[340px] sm:max-h-[420px] object-contain select-none invert rotate-90"
        />

        <div id="svg-logo-fallback" style="display: none;" class="w-full h-full items-center justify-center">
          <svg
            viewBox="0 0 420 500"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            class="w-[82%] max-w-[440px] max-h-[340px] sm:max-h-[420px] select-none rotate-90"
            aria-label="Utopia Jazz"
          >
            <g fill="#0F2133" font-family="'Oswald', Impact, sans-serif" font-weight="700" letter-spacing="-2">
              <g transform="translate(188, 468) rotate(-90)">
                <text x="0" y="0" font-size="148">UTOPIA</text>
              </g>
              <g transform="translate(362, 478) rotate(-91.5)">
                <text x="0" y="0" font-size="142">JAZZ</text>
              </g>
            </g>
          </svg>
        </div>
      </div>

      <!-- Lower Cell: High-Contrast 3-Button Action Grid -->
      <div class="grid grid-cols-1 sm:grid-cols-3">
        <!-- PROGRAM — Bold Crimson Block -->
        <a
          href="https://billetto.se/users/utopia-jazz"
          target="_blank"
          rel="noreferrer"
          class="py-6 sm:py-8 px-6 text-2xl sm:text-3xl font-bold tracking-[0.1em] uppercase border-b-[6px] sm:border-b-0 sm:border-r-[6px] border-[#0F2133] bg-[#8F1918] text-[#F1F0EA] transition-opacity hover:opacity-90 active:opacity-80 text-center block"
        >
          PROGRAM
        </a>

        <!-- BOKA BORD — Crisp Cream Block -->
        <a
          href="https://book.easytable.com/book/?id=c5c76&lang=auto"
          target="_blank"
          rel="noreferrer"
          class="py-6 sm:py-8 px-6 text-2xl sm:text-3xl font-bold tracking-[0.1em] uppercase border-b-[6px] sm:border-b-0 sm:border-r-[6px] border-[#0F2133] bg-[#F1F0EA] text-[#0F2133] transition-colors hover:bg-[#0F2133] hover:text-[#F1F0EA] text-center block"
        >
          BOKA BORD
        </a>

        <!-- MENY — Solid Midnight Navy Block -->
        <a
          href="https://utopiajazz.com/wp-content/uploads/2026/09/UtopiaMeny.260820-UTKAST-5.pdf"
          target="_blank"
          rel="noreferrer"
          class="py-6 sm:py-8 px-6 text-2xl sm:text-3xl font-bold tracking-[0.1em] uppercase bg-[#0F2133] text-[#F1F0EA] transition-opacity hover:opacity-90 active:opacity-80 text-center block"
        >
          MENY
        </a>
      </div>
    </div>

    <!-- Right Structural Rail (Desktop) -->
    <div class="hidden md:flex md:col-span-2 flex-col border-l-[6px] border-[#0F2133]">
      <div class="h-1/4 border-b-[6px] border-[#0F2133] bg-[#0F2133]"></div>
      <div class="flex-1 border-b-[6px] border-[#0F2133]"></div>
      <div class="h-1/4 bg-[#8F1918]"></div>
    </div>
  </main>

  <!-- ARCHITECTURAL FOOTER GRID -->
  <footer class="w-full grid grid-cols-12 border-t-[6px] border-[#0F2133] text-xs sm:text-sm font-semibold tracking-[0.1em] uppercase">
    <!-- Hours & Address -->
    <div class="col-span-12 lg:col-span-6 px-4 sm:px-6 py-4 flex flex-wrap items-center justify-center lg:justify-start gap-x-4 gap-y-1 border-b-[6px] lg:border-b-0 lg:border-r-[6px] border-[#0F2133]">
      <span>TIS–TOR 17–23</span>
      <span>•</span>
      <span>FRE–LÖR 16–01</span>
      <span>•</span>
      <a
        href="https://maps.google.com/?q=Karl+Johansgatan+6,+Göteborg"
        target="_blank"
        rel="noreferrer"
        class="underline underline-offset-4 hover:text-[#8F1918]"
      >
        KARL JOHANSGATAN 6, GBG
      </a>
    </div>

    <!-- Contact & Band Booking -->
    <div class="col-span-12 lg:col-span-5 px-4 sm:px-6 py-4 flex flex-wrap items-center justify-center lg:justify-end gap-x-4 gap-y-1 lg:border-r-[6px] border-[#0F2133]">
      <a href="tel:+46768941124" class="hover:text-[#8F1918]">
        +46 76 894 11 24
      </a>
      <span>•</span>
      <a href="mailto:info@utopiajazz.com" class="hover:text-[#8F1918]">
        INFO@UTOPIAJAZZ.COM
      </a>
      <span>•</span>
      <a href="mailto:anders@utopiajazz.com" class="hover:text-[#8F1918]">
        BOKA BAND: ANDERS@UTOPIAJAZZ.COM
      </a>
    </div>

    <!-- Solid Red Corner Block -->
    <div class="hidden lg:block lg:col-span-1 bg-[#8F1918]"></div>
  </footer>
</body>
</html>
