<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Utopia Jazz | Göteborg</title>
  <meta name="description" content="Live jazz, mat och dryck på Karl Johansgatan 6 i Göteborg." />

  <!-- Google Font: Oswald -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background-color: #F1F0EA;
      color: #0F2133;
      font-family: 'Oswald', sans-serif;
    }

    /* Synkoperad jazz-känsla på knapparna vid hover */
    .jazz-btn {
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    .jazz-btn-label {
      display: inline-block;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .jazz-btn:hover .jazz-btn-label {
      transform: translateY(-2px) rotate(-1.5deg);
    }
  </style>
</head>
<body class="min-h-screen w-full flex flex-col justify-between selection:bg-[#8F1918] selection:text-[#F1F0EA]">

  <!-- TOPPRAD: Mondrian-linjer med synkoperade färgaccenter -->
  <header class="w-full grid grid-cols-12 border-b-[6px] border-[#0F2133] bg-[#F1F0EA]">
    <!-- Vänster hörnblock med tre jazz-noter i färg -->
    <div class="col-span-2 bg-[#0F2133] border-r-[6px] border-[#0F2133] flex items-stretch justify-end overflow-hidden">
      <div class="w-2.5 sm:w-4 bg-[#2A5C43] border-l-[6px] border-[#0F2133]"></div>
      <div class="w-2.5 sm:w-4 bg-[#D49B2A] border-l-[6px] border-[#0F2133]"></div>
      <div class="w-2.5 sm:w-4 bg-[#8F1918] border-l-[6px] border-[#0F2133]"></div>
    </div>

    <!-- Varumärkestitel -->
    <div class="col-span-5 sm:col-span-7 px-3 sm:px-6 py-3 sm:py-4 flex items-center border-r-[6px] border-[#0F2133]">
      <span class="text-lg sm:text-2xl font-bold tracking-[0.06em] sm:tracking-[0.08em] uppercase truncate">
        UTOPIA JAZZ
      </span>
    </div>

    <!-- Sociala länkar -->
    <div class="col-span-5 sm:col-span-3 px-2.5 sm:px-6 py-3 sm:py-4 flex items-center justify-end gap-2.5 sm:gap-6 text-xs sm:text-base font-semibold tracking-[0.06em] sm:tracking-[0.1em] uppercase">
      <a
        href="https://www.instagram.com/utopiajazzgbg/"
        target="_blank"
        rel="noreferrer"
        class="hover:text-[#8F1918] transition-colors whitespace-nowrap"
      >
        INSTAGRAM
      </a>
      <a
        href="https://www.facebook.com/utopiajazzgbg/?locale=sv_SE"
        target="_blank"
        rel="noreferrer"
        class="hover:text-[#8F1918] transition-colors whitespace-nowrap"
      >
        FACEBOOK
      </a>
    </div>
  </header>

  <!-- HUVUDDEL: Stramt Mondrian-rutnät + Spretig Jazz-improvisation -->
  <main class="flex-1 w-full grid grid-cols-12">

    <!-- VÄNSTER SIDORAM: Synkoperade trappsteg & utskurna former -->
    <div class="hidden md:flex md:col-span-2 flex-col justify-between border-r-[6px] border-[#0F2133] bg-[#F1F0EA]">
      <!-- Övre fält -->
      <div class="h-[30%] border-b-[6px] border-[#0F2133] grid grid-cols-12">
        <div class="col-span-7 bg-[#D49B2A] border-r-[6px] border-[#0F2133] flex items-end justify-start overflow-hidden">
          <div class="w-4/5 h-3/5 bg-[#F1F0EA] border-t-[6px] border-r-[6px] border-[#0F2133] rounded-tr-full"></div>
        </div>
        <div class="col-span-5 flex flex-col">
          <div class="h-2/5 border-b-[6px] border-[#0F2133] bg-[#0F2133]"></div>
          <div class="flex-1 bg-[#F1F0EA] flex items-center justify-center p-1.5">
            <div class="w-4/5 aspect-square rounded-full bg-[#8F1918] border-[5px] border-[#0F2133]"></div>
          </div>
        </div>
      </div>

      <!-- Mittenfält -->
      <div class="h-[42%] border-b-[6px] border-[#0F2133] grid grid-cols-12">
        <div class="col-span-4 border-r-[6px] border-[#0F2133] flex flex-col">
          <div class="flex-1 border-b-[6px] border-[#0F2133] bg-[#F1F0EA]"></div>
          <div class="h-2/5 bg-[#2A5C43]"></div>
        </div>
        <div class="col-span-8 bg-[#8F1918] relative flex items-center justify-center overflow-hidden">
          <!-- Utskuren kvartscirkel som bryter det raka rutnätet -->
          <div class="w-full h-full bg-[#F1F0EA] rounded-bl-full border-b-[6px] border-l-[6px] border-[#0F2133] translate-x-2 -translate-y-2"></div>
        </div>
      </div>

      <!-- Nedre fält: Bygger ner mot grundlinjen -->
      <div class="flex-1 grid grid-cols-12 bg-[#F1F0EA]">
        <div class="col-span-8 bg-[#2A5C43] border-r-[6px] border-[#0F2133] flex items-center justify-center p-2">
          <div class="w-full h-3/5 bg-[#D49B2A] border-[5px] border-[#0F2133] -rotate-6"></div>
        </div>
        <div class="col-span-4 bg-[#0F2133]"></div>
      </div>
    </div>

    <!-- MITTSEKTION: Logotyp + 3 Huvudknappar -->
    <div class="col-span-12 md:col-span-8 flex flex-col justify-between">
      <!-- Övre ruta: Utopia Jazz Logotyp integrerad i Mondrian-kompositionen -->
      <div class="relative flex-1 min-h-[380px] sm:min-h-[460px] md:min-h-[520px] grid grid-cols-12 border-b-[6px] border-[#0F2133] bg-[#F1F0EA] overflow-hidden">
        <!-- Vänster inramningspelare i mittrutan som knyter an till loggan -->
        <div class="hidden sm:flex sm:col-span-2 flex-col border-r-[6px] border-[#0F2133]">
          <div class="h-1/4 border-b-[6px] border-[#0F2133] bg-[#2A5C43]"></div>
          <div class="flex-1 border-b-[6px] border-[#0F2133] bg-[#F1F0EA] flex items-center justify-center p-2">
            <div class="w-4/5 aspect-square rounded-full border-[5px] border-[#0F2133] bg-[#D49B2A]"></div>
          </div>
          <div class="h-1/5 bg-[#0F2133]"></div>
        </div>

        <!-- Huvudyta för loggan med inbyggda Mondrian- & jazzformer -->
        <div class="col-span-12 sm:col-span-8 relative flex items-center justify-center p-5 sm:p-7 bg-[#F1F0EA]">
          <!-- Geometriska hörnformer med 6px ramlinjer som förankrar loggan -->
          <div class="absolute top-0 left-0 w-12 sm:w-16 h-12 sm:h-16 border-r-[6px] border-b-[6px] border-[#0F2133] bg-[#8F1918] pointer-events-none"></div>
          <div class="absolute bottom-0 right-0 w-20 sm:w-28 h-12 sm:h-16 border-t-[6px] border-l-[6px] border-[#0F2133] bg-[#D49B2A] rounded-tl-full pointer-events-none"></div>

          <!-- Huvudlogotyp roterad 90 grader -->
          <img
            src="./utopiajazzlogosmall.png"
            alt="Utopia Jazz"
            onerror="this.style.display='none'; document.getElementById('svg-logo-fallback').style.display='flex';"
            class="relative z-10 w-[300px] sm:w-[360px] md:w-[420px] lg:w-[480px] max-w-none max-h-[76vw] sm:max-h-[54vw] md:max-h-[44vw] object-contain select-none rotate-90 transition-transform duration-500 ease-out hover:rotate-[88deg]"
          />

          <!-- Vector SVG Fallback (visas i förhandsvisningen om lokal PNG-fil saknas) -->
          <div id="svg-logo-fallback" style="display: none;" class="relative z-10 w-full h-full items-center justify-center">
            <svg
              viewBox="0 0 420 500"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              class="w-[280px] sm:w-[340px] md:w-[400px] lg:w-[460px] max-w-none max-h-[74vw] sm:max-h-[52vw] md:max-h-[42vw] select-none rotate-90 transition-transform duration-500 ease-out hover:rotate-[88deg]"
              aria-label="Utopia Jazz"
            >
              <g fill="#0F2133" font-family="'Oswald', Impact, sans-serif" font-weight="700" letter-spacing="-2">
                <g transform="translate(188, 468) rotate(-90)">
                  <text x="0" y="0" font-size="148">UTOPIA</text>
                </g>
                <g transform="translate(362, 478) rotate(-91.5)">
                  <text x="0" y="0" font-size="142">JAZZ</text>
                </g>
              </g>
            </svg>
          </div>
        </div>

        <!-- Höger inramningspelare i mittrutan -->
        <div class="hidden sm:flex sm:col-span-2 flex-col border-l-[6px] border-[#0F2133]">
          <div class="h-1/5 bg-[#D49B2A] border-b-[6px] border-[#0F2133]"></div>
          <div class="flex-1 bg-[#F1F0EA] border-b-[6px] border-[#0F2133] flex items-end justify-start overflow-hidden">
            <div class="w-full h-1/2 bg-[#2A5C43] border-t-[6px] border-r-[6px] border-[#0F2133] rounded-tr-full"></div>
          </div>
          <div class="h-1/4 bg-[#8F1918]"></div>
        </div>
      </div>

      <!-- Nedre grundlinje: 3 tydliga action-knappar -->
      <div class="grid grid-cols-1 sm:grid-cols-3">
        <!-- PROGRAM -->
        <a
          href="https://billetto.se/users/utopia-jazz"
          target="_blank"
          rel="noreferrer"
          class="jazz-btn py-6 sm:py-8 px-6 text-2xl sm:text-3xl font-bold tracking-[0.1em] uppercase border-b-[6px] sm:border-b-0 sm:border-r-[6px] border-[#0F2133] bg-[#8F1918] text-[#F1F0EA] hover:opacity-95 text-center block"
        >
          <span class="jazz-btn-label">PROGRAM</span>
        </a>

        <!-- BOKA BORD -->
        <a
          href="https://book.easytable.com/book/?id=c5c76&lang=auto"
          target="_blank"
          rel="noreferrer"
          class="jazz-btn py-6 sm:py-8 px-6 text-2xl sm:text-3xl font-bold tracking-[0.1em] uppercase border-b-[6px] sm:border-b-0 sm:border-r-[6px] border-[#0F2133] bg-[#F1F0EA] text-[#0F2133] hover:bg-[#D49B2A] hover:text-[#0F2133] text-center block"
        >
          <span class="jazz-btn-label">BOKA BORD</span>
        </a>

        <!-- MENY -->
        <a
          href="https://utopiajazz.com/wp-content/uploads/2026/09/UtopiaMeny.260820-UTKAST-5.pdf"
          target="_blank"
          rel="noreferrer"
          class="jazz-btn py-6 sm:py-8 px-6 text-2xl sm:text-3xl font-bold tracking-[0.1em] uppercase bg-[#0F2133] text-[#F1F0EA] hover:bg-[#2A5C43] hover:text-[#F1F0EA] text-center block"
        >
          <span class="jazz-btn-label">MENY</span>
        </a>
      </div>
    </div>

    <!-- HÖGER SIDORAM: Speglad rytm som bygger uppåt från grundlinjen -->
    <div class="hidden md:flex md:col-span-2 flex-col justify-between border-l-[6px] border-[#0F2133] bg-[#F1F0EA]">
      <!-- Övre fält -->
      <div class="h-[30%] border-b-[6px] border-[#0F2133] grid grid-cols-12">
        <div class="col-span-5 border-r-[6px] border-[#0F2133] flex flex-col">
          <div class="flex-1 border-b-[6px] border-[#0F2133] bg-[#F1F0EA]"></div>
          <div class="h-2/5 bg-[#0F2133]"></div>
        </div>
        <div class="col-span-7 bg-[#2A5C43] flex items-start justify-end overflow-hidden">
          <div class="w-4/5 h-3/5 bg-[#F1F0EA] border-b-[6px] border-l-[6px] border-[#0F2133] rounded-bl-full"></div>
        </div>
      </div>

      <!-- Mittenfält -->
      <div class="h-[42%] border-b-[6px] border-[#0F2133] grid grid-cols-12">
        <div class="col-span-8 bg-[#F1F0EA] border-r-[6px] border-[#0F2133] flex items-center justify-center p-3">
          <div class="w-4/5 aspect-square rounded-full bg-[#D49B2A] border-[6px] border-[#0F2133]"></div>
        </div>
        <div class="col-span-4 flex flex-col">
          <div class="h-3/5 border-b-[6px] border-[#0F2133] bg-[#8F1918]"></div>
          <div class="flex-1 bg-[#F1F0EA] flex items-center justify-center">
            <div class="w-4 h-4 rounded-full bg-[#0F2133]"></div>
          </div>
        </div>
      </div>

      <!-- Nedre fält: Bygger uppåt från bottenlinjen -->
      <div class="flex-1 grid grid-cols-12 bg-[#F1F0EA]">
        <div class="col-span-4 border-r-[6px] border-[#0F2133] bg-[#0F2133]"></div>
        <div class="col-span-8 bg-[#D49B2A] relative flex items-end justify-end overflow-hidden">
          <div class="w-full h-4/5 bg-[#8F1918] border-t-[6px] border-l-[6px] border-[#0F2133] rounded-tl-full"></div>
        </div>
      </div>
    </div>

  </main>

  <!-- SIDFOT: Öppettider, adress & kontakt -->
  <footer class="w-full grid grid-cols-12 border-t-[6px] border-[#0F2133] bg-[#F1F0EA] text-xs sm:text-sm font-semibold tracking-[0.1em] uppercase">
    <!-- Öppettider & Adress -->
    <div class="col-span-12 lg:col-span-6 px-4 sm:px-6 py-4 flex flex-wrap items-center justify-center lg:justify-start gap-x-4 gap-y-1 border-b-[6px] lg:border-b-0 lg:border-r-[6px] border-[#0F2133]">
      <span>TIS–TOR 17–23</span>
      <span>•</span>
      <span>FRE–LÖR 16–01</span>
      <span>•</span>
      <a
        href="https://maps.google.com/?q=Karl+Johansgatan+6,+Göteborg"
        target="_blank"
        rel="noreferrer"
        class="underline underline-offset-4 hover:text-[#8F1918]"
      >
        KARL JOHANSGATAN 6, GBG
      </a>
    </div>

    <!-- Kontakt & Bandbokning -->
    <div class="col-span-12 lg:col-span-5 px-4 sm:px-6 py-4 flex flex-wrap items-center justify-center lg:justify-end gap-x-4 gap-y-1 lg:border-r-[6px] border-[#0F2133]">
      <a href="tel:+46768941124" class="hover:text-[#8F1918]">
        +46 76 894 11 24
      </a>
      <span>•</span>
      <a href="mailto:info@utopiajazz.com" class="hover:text-[#8F1918]">
        INFO@UTOPIAJAZZ.COM
      </a>
      <span>•</span>
      <a href="mailto:anders@utopiajazz.com" class="hover:text-[#8F1918]">
        BOKA BAND: ANDERS@UTOPIAJAZZ.COM
      </a>
    </div>

    <!-- Rött hörnblock -->
    <div class="hidden lg:block lg:col-span-1 bg-[#8F1918]"></div>
  </footer>

</body>
</html>
